name: PR Preview - Build
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # Runs the pull request's code with a read-only token and only hands a ZIP on to
  # "PR Preview - Publish", so this is safe for pull requests from forks.
  build:
    name: Build Preview ZIP
    uses: WordPress/action-wp-playground-pr-preview/.github/workflows/preview-build.yml@v4
    with:
      artifacts: inline-typography-controls=preview/inline-typography-controls.zip
      # Keep in sync with .node-version: the reusable workflow cannot read the file.
      node-version: '24'
      build-command: |
        set -euo pipefail

        # Blocks malicious npm packages: npm and npx run through Aikido Safe Chain from here on.
        curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o /tmp/install-safe-chain.sh
        echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  /tmp/install-safe-chain.sh" | sha256sum -c -
        sh /tmp/install-safe-chain.sh --ci
        rm /tmp/install-safe-chain.sh
        # The installer adds these through GITHUB_PATH, which only applies to later steps.
        export PATH="$HOME/.safe-chain/shims:$HOME/.safe-chain/bin:$PATH"

        npm ci
        npm run build

        # Same file set as the WordPress.org release, in a folder named after the plugin
        # slug so that it installs to wp-content/plugins/inline-typography-controls/.
        mkdir -p preview/inline-typography-controls
        rsync -a \
          --exclude-from=.distignore \
          --exclude=/preview \
          ./ preview/inline-typography-controls/
        ( cd preview && zip -qr inline-typography-controls.zip inline-typography-controls )
